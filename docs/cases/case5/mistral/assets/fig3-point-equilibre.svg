<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="fig3-t fig3-d">
  <title id="fig3-t">Point d'équilibre : besoin de chauffage du logement et puissance restituée de la pompe à chaleur</title>
  <desc id="fig3-d">Schéma conceptuel. Le besoin de chauffage (ligne rouge) croît quand la température extérieure baisse, d'environ 0,7 kW à +15 °C à 4 kW à −25 °C, tandis que la puissance restituée décroît. La PAC climat froid (vert) recoupe le besoin vers −14 °C ; la PAC standard (pointillés gris) vers −6 °C, et sa puissance s'annule vers −17 °C. Les zones colorées sous les points d'équilibre sont les zones où un appoint est nécessaire.</desc>
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="30" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" fill="#1a1a2e">Point d'équilibre : besoin de chauffage et puissance de la pompe</text>

  <!-- gridlines -->
  <g stroke="#d9d9d9" stroke-width="1">
    <line x1="140" y1="70" x2="140" y2="480"/><line x1="227.5" y1="70" x2="227.5" y2="480"/>
    <line x1="315" y1="70" x2="315" y2="480"/><line x1="402.5" y1="70" x2="402.5" y2="480"/>
    <line x1="490" y1="70" x2="490" y2="480"/><line x1="577.5" y1="70" x2="577.5" y2="480"/>
    <line x1="665" y1="70" x2="665" y2="480"/><line x1="752.5" y1="70" x2="752.5" y2="480"/>
    <line x1="840" y1="70" x2="840" y2="480"/>
    <line x1="140" y1="230" x2="840" y2="230"/><line x1="140" y1="280" x2="840" y2="280"/>
    <line x1="140" y1="330" x2="840" y2="330"/><line x1="140" y1="380" x2="840" y2="380"/>
    <line x1="140" y1="430" x2="840" y2="430"/>
  </g>

  <!-- appoint zones -->
  <polygon points="140,280 467.4,357.2 402.5,385 315,455 283.75,480 140,480" fill="#555555" fill-opacity="0.12"/>
  <polygon points="140,280 336,326.2 315,330 140,425" fill="#1a7a3d" fill-opacity="0.20"/>

  <!-- axes -->
  <line x1="140" y1="480" x2="840" y2="480" stroke="#333" stroke-width="1.5"/>
  <line x1="140" y1="70" x2="140" y2="480" stroke="#333" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">
    <text x="140" y="505">−25</text><text x="227.5" y="505">−20</text><text x="315" y="505">−15</text>
    <text x="402.5" y="505">−10</text><text x="490" y="505">−5</text><text x="577.5" y="505">0</text>
    <text x="665" y="505">+5</text><text x="752.5" y="505">+10</text><text x="840" y="505">+15</text>
  </g>
  <text x="490" y="538" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Température extérieure (°C)</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="end">
    <text x="128" y="484">0</text><text x="128" y="434">1</text><text x="128" y="384">2</text>
    <text x="128" y="334">3</text><text x="128" y="284">4</text><text x="128" y="234">5</text>
  </g>
  <text x="62" y="275" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 62 275)">Puissance (kW)</text>

  <!-- curves -->
  <path d="M140,280 L840,445" stroke="#c0392b" stroke-width="3" fill="none"/>
  <path d="M840,235 L315,330 L140,425" stroke="#1a7a3d" stroke-width="4" fill="none"/>
  <path d="M840,265 L577.5,310 L402.5,385 L315,455 L283.75,480" stroke="#555555" stroke-width="3" stroke-dasharray="8,6" fill="none"/>

  <!-- balance points -->
  <line x1="336" y1="326.2" x2="336" y2="480" stroke="#1a7a3d" stroke-width="1.5" stroke-dasharray="3,5"/>
  <line x1="467.4" y1="357.2" x2="467.4" y2="480" stroke="#555555" stroke-width="1.5" stroke-dasharray="3,5"/>
  <circle cx="336" cy="326.2" r="5.5" fill="#1a7a3d" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="467.4" cy="357.2" r="5.5" fill="#555555" stroke="#ffffff" stroke-width="1.5"/>
  <text x="349" y="321" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a7a3d">≈ −14 °C</text>
  <text x="480" y="353" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#555555">≈ −6 °C</text>

  <!-- zone labels -->
  <text x="165" y="358" font-family="Arial, sans-serif" font-size="12" fill="#1a7a3d">appoint</text>
  <text x="376" y="372" font-family="Arial, sans-serif" font-size="12" fill="#555555">appoint (standard)</text>

  <!-- legend -->
  <rect x="150" y="76" width="385" height="196" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#1a1a2e">
    <line x1="170" y1="104" x2="210" y2="104" stroke="#c0392b" stroke-width="3"/>
    <text x="222" y="109">Besoin de chauffage du logement</text>
    <line x1="170" y1="138" x2="210" y2="138" stroke="#1a7a3d" stroke-width="4"/>
    <text x="222" y="143">Puissance PAC « climat froid »</text>
    <line x1="170" y1="172" x2="210" y2="172" stroke="#555555" stroke-width="3" stroke-dasharray="8,6"/>
    <text x="222" y="177">Puissance PAC standard</text>
    <circle cx="190" cy="206" r="5.5" fill="#555555"/>
    <circle cx="190" cy="206" r="5.5" fill="none"/>
    <text x="222" y="211">Point d'équilibre (besoin = puissance)</text>
    <rect x="170" y="232" width="40" height="14" fill="#1a7a3d" fill-opacity="0.20"/>
    <text x="222" y="244">Zone d'appoint (climat froid)</text>
    <rect x="170" y="260" width="40" height="14" fill="#555555" fill-opacity="0.12"/>
    <text x="222" y="272">Zone d'appoint (standard)</text>
  </g>

  <text x="30" y="578" font-family="Arial, sans-serif" font-size="12.5" fill="#666">Schéma conceptuel, valeurs hypothétiques d'après les courbes décrites dans les sources [6, 12] : le besoin croît quand il fait plus froid, la puissance décroît ; l'intersection des deux courbes définit le point d'équilibre, en dessous duquel l'appoint comble l'écart.</text>
</svg>
