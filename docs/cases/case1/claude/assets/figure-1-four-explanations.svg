<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="f1t f1d" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
<title id="f1t">Four possible explanations for a link between screens and a child outcome</title>
<desc id="f1d">Conceptual diagram with four rows. A: screens directly affect the outcome. B: a child who is already struggling is given more screens. C: a third factor such as family circumstances affects both screens and the outcome. D: screens take the place of sleep, play or conversation, which is what affects the outcome.</desc>
<rect width="720" height="372" fill="#fcfcfb"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker></defs>
<circle cx="28" cy="37.0" r="14" fill="#2a78d6"/>
<text x="28" y="42.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">A</text>
<text x="50" y="33.5" font-size="13" fill="#1f1f1c">The screen itself</text>
<text x="50" y="49.5" font-size="13" fill="#1f1f1c">does something</text>
<rect x="212" y="16" width="130" height="42" rx="6" fill="#f3f2ec" stroke="#8a8984" stroke-width="1.2"/>
<text x="277.0" y="41.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1c">Screen use</text>
<rect x="538" y="16" width="160" height="42" rx="6" fill="#f3f2ec" stroke="#8a8984" stroke-width="1.2"/>
<text x="618.0" y="41.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1c">Child outcome</text>
<line x1="342" y1="37.0" x2="538" y2="37.0" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="28" cy="125.0" r="14" fill="#2a78d6"/>
<text x="28" y="130.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">B</text>
<text x="50" y="121.5" font-size="13" fill="#1f1f1c">Reverse direction:</text>
<text x="50" y="137.5" font-size="13" fill="#1f1f1c">struggles lead to screens</text>
<rect x="212" y="104" width="130" height="42" rx="6" fill="#f3f2ec" stroke="#8a8984" stroke-width="1.2"/>
<text x="277.0" y="129.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1c">Screen use</text>
<rect x="538" y="104" width="160" height="42" rx="6" fill="#f3f2ec" stroke="#8a8984" stroke-width="1.2"/>
<text x="618.0" y="129.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1c">Child outcome</text>
<line x1="538" y1="125.0" x2="342" y2="125.0" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="28" cy="213.0" r="14" fill="#2a78d6"/>
<text x="28" y="218.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">C</text>
<text x="50" y="209.5" font-size="13" fill="#1f1f1c">Something else</text>
<text x="50" y="225.5" font-size="13" fill="#1f1f1c">causes both</text>
<rect x="212" y="192" width="130" height="42" rx="6" fill="#f3f2ec" stroke="#8a8984" stroke-width="1.2"/>
<text x="277.0" y="217.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1c">Screen use</text>
<rect x="538" y="192" width="160" height="42" rx="6" fill="#f3f2ec" stroke="#8a8984" stroke-width="1.2"/>
<text x="618.0" y="217.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1c">Child outcome</text>
<rect x="364" y="238" width="136" height="30" rx="6" fill="#f3f2ec" stroke="#8a8984" stroke-width="1.2"/>
<text x="432.0" y="257.5" text-anchor="middle" font-size="13" fill="#1f1f1c">Family circumstances</text>
<line x1="364" y1="252" x2="312" y2="236" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/>
<line x1="500" y1="252" x2="568" y2="236" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="28" cy="301.0" r="14" fill="#2a78d6"/>
<text x="28" y="306.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">D</text>
<text x="50" y="297.5" font-size="13" fill="#1f1f1c">Screens replace</text>
<text x="50" y="313.5" font-size="13" fill="#1f1f1c">something valuable</text>
<rect x="212" y="280" width="130" height="42" rx="6" fill="#f3f2ec" stroke="#8a8984" stroke-width="1.2"/>
<text x="277.0" y="305.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1c">Screen use</text>
<rect x="538" y="280" width="160" height="42" rx="6" fill="#f3f2ec" stroke="#8a8984" stroke-width="1.2"/>
<text x="618.0" y="305.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1c">Child outcome</text>
<rect x="370" y="282" width="124" height="38" rx="6" fill="#ffffff" stroke="#8a8984" stroke-width="1.2"/>
<text x="432.0" y="298.0" text-anchor="middle" font-size="13" fill="#1f1f1c">less sleep, play,</text>
<text x="432.0" y="313.0" text-anchor="middle" font-size="13" fill="#1f1f1c">talk, reading</text>
<line x1="342" y1="301.0" x2="370" y2="301.0" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/>
<line x1="494" y1="301.0" x2="538" y2="301.0" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/>
</svg>